<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Heart Hunt</title>
<meta name="description" content="A retro 8-bit heart collecting game. Tap the hearts before they vanish.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 9 8' shape-rendering='crispEdges'%3E%3Cpath d='M1 0h2v1h-2z M6 0h2v1h-2z M0 1h4v1h-4z M5 1h4v1h-4z M0 2h9v2h-9z M1 4h7v1h-7z M2 5h5v1h-5z M3 6h3v1h-3z M4 7h1v1h-1z' fill='%23ff3d7f'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{--bg:#1b1035;--panel:#2a1a52;--edge:#4a2f8a;--cream:#fff1d6;--pink:#ff3d7f;--gold:#ffd23f;--teal:#2ee6c5;--violet:#7a5cc4;--muted:#9d86d6;--shadow:#6b1f5c}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:#0f0820}
body{display:flex;justify-content:center;align-items:flex-start;font-family:'Press Start 2P','Courier New',monospace;color:var(--cream);padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
button{font-family:inherit}
button:focus-visible{outline:4px solid var(--gold);outline-offset:2px}
.game{position:relative;width:100%;max-width:480px;min-height:100%;background:var(--bg);padding:24px;display:flex;flex-direction:column;gap:16px}
.game::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.12) 0,rgba(0,0,0,.12) 2px,transparent 2px,transparent 4px)}
h1{margin:0;text-align:center;font-size:clamp(22px,7vw,30px);line-height:1.3;color:var(--pink);text-shadow:4px 4px 0 var(--shadow)}
.stats{display:flex;gap:8px}
.stat{flex:1;background:var(--panel);border:4px solid var(--edge);padding:10px;display:flex;flex-direction:column;gap:8px;min-width:0}
.stat span:first-child{font-size:9px;color:var(--muted)}
.stat span:last-child{font-size:clamp(14px,5vw,20px)}
.bar{height:16px;background:var(--panel);border:4px solid var(--edge)}
.bar div{height:100%;background:var(--teal);width:100%;transition:width .12s linear}
.board{position:relative}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.cell{aspect-ratio:1/1;min-height:64px;padding:0;background:var(--panel);border:4px solid var(--edge);border-radius:0;cursor:pointer;display:flex;align-items:center;justify-content:center;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.cell svg{width:62%;height:auto}
.cell .pop{font-size:clamp(11px,4vw,16px)}
.overlay{position:absolute;inset:0;background:rgba(27,16,53,.95);border:4px solid var(--edge);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;text-align:center;z-index:2}
.overlay[hidden]{display:none}
.overlay p{margin:0;font-size:11px;line-height:1.9}
.cta{min-height:52px;padding:14px 22px;font-size:14px;color:var(--bg);background:var(--gold);border:4px solid var(--cream);border-radius:0;box-shadow:4px 4px 0 var(--shadow);cursor:pointer}
.cta:active{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--shadow)}
.cta.teal{background:var(--teal)}
.legend{display:flex;justify-content:space-between;font-size:10px}
.legend div{display:flex;align-items:center;gap:8px}
.legend svg{width:22px;height:20px}
@media (prefers-reduced-motion:reduce){.bar div{transition:none}.cta:active{transform:none}}
</style>
</head>
<body>
<main class="game">
<h1>HEART HUNT</h1>
<div class="stats">
<div class="stat"><span>SCORE</span><span id="score" style="color:var(--gold)">0</span></div>
<div class="stat"><span>TIME</span><span id="time" style="color:var(--teal)">30</span></div>
<div class="stat"><span>BEST</span><span id="best">0</span></div>
</div>
<div class="bar" aria-hidden="true"><div id="bar"></div></div>
<div class="board">
<div class="grid" id="grid"></div>
<div class="overlay" id="title">
<svg viewBox="0 0 9 8" width="90" height="80" shape-rendering="crispEdges" aria-hidden="true"><path d="M1 0h2v1h-2z M6 0h2v1h-2z M0 1h4v1h-4z M5 1h4v1h-4z M0 2h9v2h-9z M1 4h7v1h-7z M2 5h5v1h-5z M3 6h3v1h-3z M4 7h1v1h-1z" fill="#ff3d7f"/><rect x="1" y="1" width="1" height="1" fill="#fff1d6"/><rect x="2" y="2" width="1" height="1" fill="#fff1d6"/></svg>
<p>TAP HEARTS<br>BEFORE THEY VANISH</p>
<button class="cta" id="start" type="button">PRESS START</button>
</div>
<div class="overlay" id="over" hidden>
<span style="font-size:18px;color:var(--pink)">GAME OVER</span>
<span style="font-size:11px;color:var(--muted)">FINAL SCORE</span>
<span id="final" style="font-size:32px;color:var(--gold)">0</span>
<button class="cta teal" id="again" type="button">PLAY AGAIN</button>
</div>
</div>
<div class="legend" aria-label="Scoring">
<div><svg viewBox="0 0 9 8" shape-rendering="crispEdges" aria-hidden="true"><use href="#h" fill="#ff3d7f"/></svg>+1</div>
<div><svg viewBox="0 0 9 8" shape-rendering="crispEdges" aria-hidden="true"><use href="#h" fill="#ffd23f"/></svg>+5</div>
<div><svg viewBox="0 0 9 8" shape-rendering="crispEdges" aria-hidden="true"><use href="#h" fill="#7a5cc4"/><path d="M4 0h1v2h-1z M5 2h1v2h-1z M3 4h1v2h-1z" fill="#1b1035"/></svg>-3</div>
</div>
</main>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><path id="h" d="M1 0h2v1h-2z M6 0h2v1h-2z M0 1h4v1h-4z M5 1h4v1h-4z M0 2h9v2h-9z M1 4h7v1h-7z M2 5h5v1h-5z M3 6h3v1h-3z M4 7h1v1h-1z"/></defs></svg>
<script>
(function(){
  var SECONDS=30, TICK=125;
  var $=function(id){return document.getElementById(id)};
  var grid=$('grid'), scoreEl=$('score'), timeEl=$('time'), bestEl=$('best'), bar=$('bar');
  var titleEl=$('title'), overEl=$('over'), finalEl=$('final');
  var cells=[], buttons=[], phase='title', score=0, time=SECONDS, ticks=0, best=0, timer=null;
  try{best=parseInt(localStorage.getItem('heartHuntBest'),10)||0}catch(e){}
  bestEl.textContent=best;

  var COLORS={pink:'#ff3d7f',gold:'#ffd23f',broken:'#7a5cc4'};
  var LABELS={pink:'Heart, plus 1',gold:'Golden heart, plus 5',broken:'Broken heart, minus 3'};

  for(var i=0;i<16;i++){
    (function(i){
      var b=document.createElement('button');
      b.type='button'; b.className='cell'; b.setAttribute('aria-label','Empty slot');
      b.addEventListener('pointerdown',function(e){e.preventDefault();hit(i)});
      b.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();hit(i)}});
      grid.appendChild(b); buttons.push(b); cells.push(null);
    })(i);
  }

  function heartSvg(type){
    var c=COLORS[type];
    return '<svg viewBox="0 0 9 8" shape-rendering="crispEdges" aria-hidden="true"><use href="#h" fill="'+c+'"/>'+
      '<rect x="1" y="1" width="1" height="1" fill="#fff1d6"/><rect x="2" y="2" width="1" height="1" fill="#fff1d6"/>'+
      (type==='broken'?'<path d="M4 0h1v2h-1z M5 2h1v2h-1z M3 4h1v2h-1z" fill="#1b1035"/>':'')+'</svg>';
  }
  function draw(i){
    var c=cells[i], b=buttons[i];
    if(!c){b.innerHTML='';b.setAttribute('aria-label','Empty slot')}
    else if(c.type==='pop'){b.innerHTML='<span class="pop" style="color:'+(c.good?'#2ee6c5':'#ff3d7f')+'">'+c.label+'</span>';b.setAttribute('aria-label','Collected')}
    else{b.innerHTML=heartSvg(c.type);b.setAttribute('aria-label',LABELS[c.type])}
  }
  function render(){
    for(var i=0;i<16;i++)draw(i);
    scoreEl.textContent=score; timeEl.textContent=time; bestEl.textContent=best;
    bar.style.width=Math.max(0,time/SECONDS*100)+'%';
  }
  function start(){
    clearInterval(timer);
    phase='play'; score=0; time=SECONDS; ticks=0;
    cells=cells.map(function(){return null});
    titleEl.hidden=true; overEl.hidden=true;
    render(); timer=setInterval(tick,TICK);
  }
  function end(){
    clearInterval(timer); phase='over';
    cells=cells.map(function(){return null});
    if(score>best){best=score;try{localStorage.setItem('heartHuntBest',String(best))}catch(e){}}
    finalEl.textContent=score; overEl.hidden=false; time=0; render();
    $('again').focus();
  }
  function tick(){
    ticks++;
    cells=cells.map(function(c){return c?{type:c.type,ttl:c.ttl-1,label:c.label,good:c.good}:null})
               .map(function(c){return c&&c.ttl>0?c:null});
    if(Math.random()<0.3){
      var empty=[];cells.forEach(function(c,i){if(!c)empty.push(i)});
      if(empty.length){
        var i=empty[Math.floor(Math.random()*empty.length)], r=Math.random();
        cells[i]=r<0.1?{type:'gold',ttl:9}:r<0.3?{type:'broken',ttl:14}:{type:'pink',ttl:14};
      }
    }
    if(ticks%8===0)time--;
    if(time<=0)end();else render();
  }
  function hit(i){
    if(phase!=='play')return;
    var c=cells[i];
    if(!c||c.type==='pop')return;
    var d=c.type==='gold'?5:c.type==='broken'?-3:1;
    cells[i]={type:'pop',ttl:3,label:(d>0?'+':'')+d,good:d>0};
    score=Math.max(0,score+d); render();
  }
  $('start').addEventListener('click',start);
  $('again').addEventListener('click',start);
  $('start').focus();
  render();
})();
</script>
</body>
</html>
